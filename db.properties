# --- Oracle database settings ---
db.driver=oracle.jdbc.OracleDriver

# Primary connection URL. Use the SAME service name / SID your SQL Developer connection uses:
#   Oracle XE 11g  (SID XE)        : jdbc:oracle:thin:@localhost:1521:XE
#   Oracle XE 18c / 21c (pluggable): jdbc:oracle:thin:@//localhost:1521/XEPDB1
#   Oracle 11g/12c/19c with service: jdbc:oracle:thin:@//localhost:1521/XE
db.url=jdbc:oracle:thin:@//localhost:1521/XE

# Tried automatically (in order) ONLY when the primary URL cannot reach the listener/service
# (ORA-12514, ORA-12505, ORA-12541, I/O error). Comma separated. Leave empty to disable.
db.url.fallbacks=jdbc:oracle:thin:@//localhost:1521/XEPDB1,jdbc:oracle:thin:@localhost:1521:XE

db.user=system
db.password=24761A05Z9

# The values above can be overridden without editing this file, using environment variables
# HMS_DB_URL, HMS_DB_USER, HMS_DB_PASSWORD or JVM options -Dhms.db.url=... -Dhms.db.user=... -Dhms.db.password=...
